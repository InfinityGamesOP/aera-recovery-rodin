name: Build AERA Recovery

on:
  workflow_dispatch:

jobs:
  build:
    name: Build AERA Recovery via GitHub Actions
    runs-on: ubuntu-22.04

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Clean Up Environment
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
        zlib1g-dev libc6-dev-i386 libncurses5-dev libncurses5 libncurses-dev \
        g++-multilib gcc-multilib x11proto-core-dev libx11-dev lib32z1-dev \
        libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig cpio python3 python-is-python3

        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+x ~/.bin/repo

    - name: Sync Sources & Build AERA Recovery
      run: |
        export PATH=~/.bin:$PATH
        mkdir -p ~/aera && cd ~/aera

        # 1. Inicjalizacja bazy źródeł LineageOS 21.0 (Android 14)
        repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --depth=1

        # 2. Utworzenie local_manifest bez dublowania ścieżek z oficjalnego manifestu
        mkdir -p .repo/local_manifests
        cat << 'EOF' > .repo/local_manifests/rodin.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <project path="device/xiaomi/rodin" name="xiaomi-mt6899-dev/android_device_xiaomi_rodin" remote="github" revision="main" />
          <project path="device/xiaomi/rodin-kernel" name="xiaomi-mt6899-dev/android_device_xiaomi_rodin-kernel" remote="github" revision="main" />
          <project path="hardware/mediatek" name="LineageOS/android_hardware_mediatek" remote="github" revision="lineage-21.0" />
          <project path="device/mediatek/sepolicy_vndr" name="LineageOS/android_device_mediatek_sepolicy_vndr" remote="github" revision="lineage-21.0" />
        </manifest>
        EOF

        # 3. Synchronizacja kodu
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)

        # 4. Usunięcie niekompatybilnych plików Android.bp w modułach sprzętowych
        find hardware/mediatek -name "Android.bp" -delete || true
        rm -f hardware/lineage/compat/Android.bp || true

        # 5. Podmiana silnika recovery na AERA
        rm -rf bootable/recovery
        git clone https://github.com/AERA-Recovery/android_bootable_recovery.git bootable/recovery --depth=1

        # Fix zasobów i uprawnień AERA
        mkdir -p bootable/recovery/gui/theme/common/fonts
        mkdir -p recovery
        chmod -R 777 bootable/recovery
        find bootable/recovery -type f \( -name "*.mk" -o -name "*.bp" -o -name "*.sh" \) -exec sed -i 's/mkdir recovery/mkdir -p bootable\/recovery\/gui/g' {} + || true

        # Fix architektury pod rodin
        cd device/xiaomi/rodin
        sed -i '/FOX_/d' BoardConfig.mk || true
        sed -i '/OF_/d' BoardConfig.mk || true
        sed -i 's/armv9-a/armv8-2a/g' BoardConfig.mk || true
        sed -i 's/armv9/armv8/g' BoardConfig.mk || true

        # Przygotowanie plików makefile
        PROD_MK=$(ls *.mk | grep -E 'rodin|device|lineage' | head -n 1)
        if [ -n "$PROD_MK" ]; then
          cp "$PROD_MK" lineage_rodin.mk
        else
          cp BoardConfig.mk lineage_rodin.mk
        fi

        cat << 'EOF_AP' > AndroidProducts.mk
        PRODUCT_MAKEFILES := \
            $(LOCAL_DIR)/lineage_rodin.mk

        COMMON_LUNCH_CHOICES := \
            lineage_rodin-ap2a-userdebug \
            lineage_rodin-ap2a-eng
        EOF_AP

        cd ~/aera

        # 6. Kompilacja
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export TARGET_RELEASE=ap2a
        export BUILD_BROKEN_MISSING_BUILD_REQUIREMENTS=true

        lunch lineage_rodin-ap2a-userdebug || lunch lineage_rodin-ap2a-eng

        mka vendorbootimage -j$(nproc --all) || mka recoveryimage -j$(nproc --all)

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AERA_Recovery_Poco_X7_Pro
        path: |
          ~/aera/out/target/product/rodin/vendor_boot.img
          ~/aera/out/target/product/rodin/recovery.img
        if-no-files-found: warn
