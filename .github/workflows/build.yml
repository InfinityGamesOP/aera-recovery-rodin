name: Build AERA Recovery

on:
  workflow_dispatch:

jobs:
  build:
    name: Build AERA Recovery via GitHub Actions
    runs-on: ubuntu-22.04

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Clean Up Environment
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
        zlib1g-dev libc6-dev-i386 libncurses5-dev libncurses5 libncurses-dev \
        g++-multilib gcc-multilib x11proto-core-dev libx11-dev lib32z1-dev \
        libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig cpio python3 python-is-python3

        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+x ~/.bin/repo

    - name: Sync Sources & Build AERA Recovery
      run: |
        export PATH=~/.bin:$PATH
        mkdir -p ~/aera && cd ~/aera

        # Inicjalizacja bazy źródeł LineageOS 21.0
        repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --depth=1
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)

        # Podmiana silnika recovery na AERA
        rm -rf bootable/recovery
        git clone https://github.com/AERA-Recovery/android_bootable_recovery.git bootable/recovery --depth=1

        # Pobranie brakującego sprzętu MediaTek wymaganego przez drzewo rodin
        git clone https://github.com/LineageOS/android_hardware_mediatek.git -b lineage-21.0 hardware/mediatek --depth=1 || git clone https://github.com/LineageOS/android_hardware_mediatek.git hardware/mediatek --depth=1

        # Pre-creation folderów czcionek i nadanie praw
        mkdir -p bootable/recovery/gui/theme/common/fonts
        mkdir -p recovery
        chmod -R 777 bootable/recovery

        # Pobranie drzewa urządzeń dla Poco X7 Pro (rodin)
        git clone https://github.com/xiaomi-mt6899-dev/android_device_xiaomi_rodin.git device/xiaomi/rodin --depth=1
        git clone https://github.com/xiaomi-mt6899-dev/android_device_xiaomi_rodin-kernel.git device/xiaomi/rodin-kernel --depth=1 || true

        # Usunięcie ze skryptów AERA sztywnych prób tworzenia folderów "mkdir recovery"
        find bootable/recovery -type f \( -name "*.mk" -o -name "*.bp" -o -name "*.sh" \) -exec sed -i 's/mkdir recovery/mkdir -p bootable\/recovery\/gui/g' {} + || true

        # Konfiguracja drzewa urządzenia
        cd device/xiaomi/rodin
        sed -i '/FOX_/d' BoardConfig.mk || true
        sed -i '/OF_/d' BoardConfig.mk || true

        PROD_MK=$(ls *.mk | grep -E 'rodin|device|lineage' | head -n 1)
        if [ -n "$PROD_MK" ]; then
          cp "$PROD_MK" lineage_rodin.mk
        else
          cp BoardConfig.mk lineage_rodin.mk
        fi

        cat << 'EOF' > AndroidProducts.mk
        PRODUCT_MAKEFILES := \
            $(LOCAL_DIR)/lineage_rodin.mk

        COMMON_LUNCH_CHOICES := \
            lineage_rodin-ap2a-userdebug \
            lineage_rodin-ap2a-eng
        EOF

        cd ~/aera

        # Przygotowanie środowiska i kompilacja z poprawnymi zmiennymi
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export TARGET_RELEASE=ap2a
        export BUILD_BROKEN_MISSING_BUILD_REQUIREMENTS=true

        lunch lineage_rodin-ap2a-userdebug || lunch lineage_rodin-ap2a-eng || true

        mka vendorbootimage -j$(nproc --all) || mka recoveryimage -j$(nproc --all)

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AERA_Recovery_Poco_X7_Pro
        path: |
          ~/aera/out/target/product/rodin/vendor_boot.img
          ~/aera/out/target/product/rodin/recovery.img
        if-no-files-found: warn
