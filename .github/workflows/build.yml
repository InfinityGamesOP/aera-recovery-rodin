name: Build AERA Recovery

on:
  workflow_dispatch:

jobs:
  build:
    name: Build AERA Recovery via GitHub Actions
    runs-on: ubuntu-22.04

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Clean Up Environment
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
        zlib1g-dev libc6-dev-i386 libncurses5-dev libncurses5 libncurses-dev \
        g++-multilib gcc-multilib x11proto-core-dev libx11-dev lib32z1-dev \
        libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig cpio python3 python-is-python3

        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+x ~/.bin/repo

    - name: Sync Sources & Build AERA Recovery
      run: |
        export PATH=~/.bin:$PATH
        mkdir -p ~/aera && cd ~/aera

        # Inicjalizacja bazy źródeł TWRP/AOSP 12.1
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)

        # Podmiana silnika recovery na AERA
        rm -rf bootable/recovery
        git clone https://github.com/AERA-Recovery/android_bootable_recovery.git bootable/recovery --depth=1

        # Pobranie drzewa urządzeń dla Poco X7 Pro (rodin)
        git clone https://github.com/xiaomi-mt6899-dev/android_device_xiaomi_rodin.git device/xiaomi/rodin --depth=1

        # Pobranie wymaganych zależności hardware i SEPolicy MediaTek
        git clone https://github.com/LineageOS/android_hardware_lineage_compat.git hardware/lineage/compat --depth=1
        git clone https://github.com/LineageOS/android_hardware_mediatek.git hardware/mediatek --depth=1 || true
        git clone https://github.com/LineageOS/android_device_mediatek_sepolicy_vndr.git device/mediatek/sepolicy_vndr --depth=1 || true

        # Usunięcie niekompatybilnych plików Android.bp powodujących błąd "select"
        rm -f hardware/lineage/compat/Android.bp
        rm -rf hardware/mediatek/wlan/libwifi-hal-wrapper/Android.bp
        rm -rf hardware/mediatek/aidl/usb/Android.bp
        rm -rf hardware/mediatek/libmtkperf_client/Android.bp
        rm -rf hardware/mediatek/aidl/vibrator/Android.bp

        # Tworzenie atrapy plików vendor i modułów jądra
        mkdir -p vendor/xiaomi/rodin
        echo '# Dummy vendor makefile' > vendor/xiaomi/rodin/rodin-vendor.mk
        mkdir -p device/mediatek/sepolicy_vndr
        touch device/mediatek/sepolicy_vndr/SEPolicy.mk

        mkdir -p device/xiaomi/rodin-kernel
        touch device/xiaomi/rodin-kernel/modules.load.system
        touch device/xiaomi/rodin-kernel/modules.load.vendor
        touch device/xiaomi/rodin-kernel/modules.load.vendor_ramdisk
        touch device/xiaomi/rodin-kernel/modules.load.recovery

        # Konfiguracja drzewa urządzenia i oczyszczenie flag armv9-a
        cd device/xiaomi/rodin
        
        sed -i '/FOX_/d' BoardConfig.mk || true
        sed -i '/OF_/d' BoardConfig.mk || true
        sed -i '/vendor\/xiaomi\/rodin/d' BoardConfig.mk || true
        sed -i '/sepolicy_vndr/d' BoardConfig.mk || true
        
        sed -i 's/armv9-a/armv8-2a/g' BoardConfig.mk || true
        sed -i 's/armv9/armv8/g' BoardConfig.mk || true

        # Tworzenie pliku omni_rodin.mk
        cat << 'EOF' > omni_rodin.mk
        LOCAL_DIR := device/xiaomi/rodin

        $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)
        $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)

        PRODUCT_NAME := omni_rodin
        PRODUCT_DEVICE := rodin
        PRODUCT_MANUFACTURER := xiaomi
        PRODUCT_BRAND := Xiaomi
        PRODUCT_MODEL := Poco X7 Pro

        PRODUCT_GMS_CLIENTID_BASE := android-xiaomi
        EOF

        # Utworzenie AndroidProducts.mk
        echo -e "PRODUCT_MAKEFILES := \$(LOCAL_DIR)/omni_rodin.mk\nCOMMON_LUNCH_CHOICES := omni_rodin-eng omni_rodin-userdebug" > AndroidProducts.mk

        cd ~/aera

        # Przygotowanie środowiska i uruchomienie kompilacji
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C

        lunch omni_rodin-eng || lunch omni_rodin-userdebug

        mka vendorbootimage -j$(nproc --all) || mka recoveryimage -j$(nproc --all)

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AERA_Recovery_Poco_X7_Pro
        path: |
          ~/aera/out/target/product/rodin/vendor_boot.img
          ~/aera/out/target/product/rodin/recovery.img
        if-no-files-found: warn
