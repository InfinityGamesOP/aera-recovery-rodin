name: Build AERA Recovery

on:
  workflow_dispatch:

jobs:
  build:
    name: Build AERA Recovery via GitHub Actions
    runs-on: ubuntu-22.04

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Clean Up Environment
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
        zlib1g-dev libc6-dev-i386 libncurses5-dev libncurses5 libncurses-dev \
        g++-multilib gcc-multilib x11proto-core-dev libx11-dev lib32z1-dev \
        libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig cpio python3 python-is-python3

        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+x ~/.bin/repo

    - name: Sync Sources & Build AERA Recovery
      run: |
        export PATH=~/.bin:$PATH
        mkdir -p ~/aera && cd ~/aera

        # Inicjalizacja nowoczesnego manifestu LineageOS 21.0 (Android 14) kompatybilnego z drzewem rodin
        repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --depth=1
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)

        # Podmiana silnika recovery na AERA
        rm -rf bootable/recovery
        git clone https://github.com/AERA-Recovery/android_bootable_recovery.git bootable/recovery --depth=1

        # Pobranie drzewa urządzeń dla Poco X7 Pro (rodin)
        git clone https://github.com/xiaomi-mt6899-dev/android_device_xiaomi_rodin.git device/xiaomi/rodin --depth=1

        # Pobranie brakujących zależności jądra dla rodin (jeśli istnieją w oddzielnym repo)
        git clone https://github.com/xiaomi-mt6899-dev/android_device_xiaomi_rodin-kernel.git device/xiaomi/rodin-kernel --depth=1 || true

        # Konfiguracja drzewa urządzenia pod recovery
        cd device/xiaomi/rodin
        sed -i '/FOX_/d' BoardConfig.mk || true
        sed -i '/OF_/d' BoardConfig.mk || true

        # Tworzenie pliku omni_rodin.mk jeśli go brak
        if [ ! -f omni_rodin.mk ]; then
          TARGET_MK=$(ls *.mk | grep -E 'lineage|device' | head -n 1)
          if [ -n "$TARGET_MK" ]; then
            cp "$TARGET_MK" omni_rodin.mk
          else
            cp BoardConfig.mk omni_rodin.mk
          fi
        fi

        # Wymuszenie wpisów lunch w AndroidProducts.mk
        echo -e "PRODUCT_MAKEFILES := \$(LOCAL_DIR)/omni_rodin.mk\nCOMMON_LUNCH_CHOICES := lineage_rodin-eng lineage_rodin-userdebug omni_rodin-eng omni_rodin-userdebug" > AndroidProducts.mk

        cd ~/aera

        # Przygotowanie środowiska i kompilacja
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C

        lunch lineage_rodin-userdebug || lunch omni_rodin-eng

        mka vendorbootimage -j$(nproc --all) || mka recoveryimage -j$(nproc --all)

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AERA_Recovery_Poco_X7_Pro
        path: |
          ~/aera/out/target/product/rodin/vendor_boot.img
          ~/aera/out/target/product/rodin/recovery.img
        if-no-files-found: warn
