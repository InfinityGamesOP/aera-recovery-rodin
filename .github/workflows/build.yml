name: Build AERA Recovery for Poco X7 Pro (rodin)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch manifestu AERA'
        required: true
        default: 'aera-16.0'
        type: string

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Utworzenie pliku SWAP (zwiększenie RAM do 32GB)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile ~/swapfile /mnt/swapfile
          sudo fallocate -l 32G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=32768 status=progress
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Maksymalizacja wolnego miejsca na dysku
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Instalacja zależności systemowych (Ubuntu 26.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses-dev libncurses6 \
            g++-multilib gcc-multilib x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig cpio \
            python3 python-is-python3 rsync bc ccache

      - name: Konfiguracja globalna Git (optymalizacja sieci)
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 600

      - name: Konfiguracja narzędzia Repo
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Inicjalizacja i synchronizacja źródeł AERA
        run: |
          mkdir -p ~/aera-workspace
          cd ~/aera-workspace
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          repo init -u https://github.com/AERA-Recovery/android_manifest.git -b ${{ inputs.branch }} --depth=1
          repo sync -j4 --force-sync --no-clone-bundle --no-tags

      - name: Pobranie drzewa urządzenia dla Poco X7 Pro (rodin)
        run: |
          cd ~/aera-workspace
          git clone https://github.com/KSN2redawew/android_device_xiaomi_rodin-twrp device/xiaomi/rodin || true

      - name: Usunięcie konfliktowych prebuiltów APEX dla Recovery
        run: |
          cd ~/aera-workspace
          rm -rf prebuilts/module_sdk/CrashRecovery || true

      - name: Budowanie Recovery (MediaTek / rodin)
        run: |
          cd ~/aera-workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          export SOONG_GEN_COMPDB=0
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          
          source build/envsetup.sh
          
          lunch twrp_rodin-ap3a-userdebug || lunch twrp_rodin-ap3a-eng || lunch aera_rodin-ap3a-userdebug || lunch omni_rodin-ap3a-eng || lunch twrp_rodin-eng
          
          # Użycie -j1 zapobiega przepełnieniu pamięci RAM podczas kompilacji Soong/Ninja
          mka -j1 recoveryimage vendor_bootimage

      - name: Przesłanie artefaktów wynikowych
        uses: actions/upload-artifact@v4
        with:
          name: AERA-Recovery-Poco-X7Pro-rodin
          path: |
            ~/aera-workspace/out/target/product/rodin/recovery.img
            ~/aera-workspace/out/target/product/rodin/vendor_boot.img
            ~/aera-workspace/out/target/product/rodin/boot.img
