name: Build AERA Recovery for Poco X7 Pro (rodin)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch manifestu AERA (np. android-14.0)'
        required: true
        default: 'android-14.0'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maksymalizacja wolnego miejsca na dysku
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Instalacja zależności systemowych
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5-dev libncurses5 libncurses-dev \
            g++-multilib gcc-multilib x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig cpio \
            python3 python-is-python3 rsync bc ccache

      - name: Konfiguracja narzędzia Repo
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Inicjalizacja i synchronizacja źródeł AERA
        run: |
          mkdir -p ~/aera-workspace
          cd ~/aera-workspace
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          repo init -u https://github.com/AERA-Recovery/android_manifest.git -b ${{ inputs.branch }} --depth=1
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Pobranie drzewa urządzenia dla Poco X7 Pro (rodin)
        run: |
          cd ~/aera-workspace
          # Klonowanie drzewa dla rodin (dostosuj adres, jeśli używasz własnego forka)
          git clone https://github.com/KSN2redawew/android_device_xiaomi_rodin-twrp device/xiaomi/rodin || true

      - name: Budowanie Recovery (MediaTek / rodin)
        run: |
          cd ~/aera-workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          
          # Wybór luncza (zmień na odpowiedni prefix w zależności od definicji w drzewie rodin)
          lunch aera_rodin-userdebug || lunch omni_rodin-userdebug || lunch twrp_rodin-userdebug
          
          # Dla urządzeń MediaTek z dynamicznymi partycjami budujemy recovery oraz vendor_boot
          mka recoveryimage vendor_bootimage

      - name: Przesłanie artefaktów wynikowych
        uses: actions/upload-artifact@v4
        with:
          name: AERA-Recovery-Poco-X7Pro-rodin
          path: |
            ~/aera-workspace/out/target/product/rodin/recovery.img
            ~/aera-workspace/out/target/product/rodin/vendor_boot.img
            ~/aera-workspace/out/target/product/rodin/boot.img
