name: Build AERA Recovery

on:
  workflow_dispatch:

jobs:
  build:
    name: Build AERA Recovery via GitHub Actions
    runs-on: ubuntu-22.04

    steps:
    - name: Clean Up Environment
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
        zlib1g-dev libc6-dev-i386 libncurses5-dev libncurses5 libncurses-dev \
        g++-multilib gcc-multilib x11proto-core-dev libx11-dev lib32z1-dev \
        libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig cpio python3

        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+x ~/.bin/repo

    - name: Sync Sources & Build AERA Recovery
      run: |
        export PATH=~/.bin:$PATH
        mkdir -p ~/aera && cd ~/aera

        # Inicjalizacja stabilnego manifestu Omni dla Androida 14
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b android-14.0 --depth=1
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)

        # Podmiana silnika recovery na AERA (LVGL)
        rm -rf bootable/recovery
        git clone https://github.com/AERA-Recovery/android_bootable_recovery.git bootable/recovery --depth=1

        # Pobranie drzewa urządzeń dla Poco X7 Pro (rodin)
        git clone https://github.com/xiaomi-mt6899-dev/android_device_xiaomi_rodin.git device/xiaomi/rodin --depth=1

        # Przygotowanie konfiguracji omni_rodin
        cd device/xiaomi/rodin
        sed -i '/FOX_/d' BoardConfig.mk || true
        sed -i '/OF_/d' BoardConfig.mk || true
        
        TARGET_MK=$(ls *.mk | grep -E 'crdroid|lineage|device' | head -n 1)
        if [ -n "$TARGET_MK" ]; then
          cp "$TARGET_MK" omni_rodin.mk
        else
          cp BoardConfig.mk omni_rodin.mk
        fi
        sed -i 's/crdroid_rodin/omni_rodin/g' omni_rodin.mk || true
        sed -i 's/lineage_rodin/omni_rodin/g' omni_rodin.mk || true

        # Bezpieczne zapisanie AndroidProducts.mk
        echo "PRODUCT_MAKEFILES := \$(LOCAL_DIR)/omni_rodin.mk" > AndroidProducts.mk
        cd ~/aera

        # Uruchomienie procedury budowania
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch omni_rodin-eng
        mka vendorbootimage -j$(nproc) || mka recoveryimage -j$(nproc)

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AERA_Recovery_Poco_X7_Pro
        path: |
          ~/aera/out/target/product/rodin/vendor_boot.img
          ~/aera/out/target/product/rodin/recovery.img
